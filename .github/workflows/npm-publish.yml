name: Build & Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip npm publish)'
        required: false
        default: 'false'
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc

          # macOS x64
          - os: macos-latest
            target: x86_64-apple-darwin

          # macOS arm64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin

          # Linux x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        working-directory: native
        run: npm ci

      - name: Build native module
        working-directory: native
        run: npx napi build --platform --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: native/*.node
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        working-directory: native
        run: npm ci

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: native/artifacts

      - name: List artifacts
        run: ls -R native/artifacts

      - name: Move artifacts
        working-directory: native
        run: npx napi artifacts --dir artifacts

      - name: Prepare packages
        working-directory: native
        run: npx napi prepublish -t npm

      - name: List packages
        working-directory: native
        run: |
          echo "=== Main package ==="
          ls -la
          echo "=== Platform packages ==="
          ls -la npm/ || true

      - name: Publish (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        working-directory: native
        run: |
          echo "Dry run - would publish:"
          npm pack --dry-run
          for dir in npm/*/; do
            echo "--- $dir ---"
            (cd "$dir" && npm pack --dry-run)
          done

      - name: Publish platform packages
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: native
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in npm/*/; do
            echo "Publishing $dir..."
            (cd "$dir" && npm publish --access public) || echo "Failed to publish $dir (may already exist)"
          done

      - name: Publish main package
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: native
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
