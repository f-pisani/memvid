name: Build & Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip npm publish)'
        required: false
        default: 'false'
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc

          # macOS
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

          # Linux (glibc)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true

          # Linux (musl)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true

          # Linux ARM 32-bit
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            cross: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf musl-tools

          # For aarch64-unknown-linux-gnu
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          fi

          # For aarch64-unknown-linux-musl
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y musl-dev
            rustup target add aarch64-unknown-linux-musl
          fi

          # For armv7-unknown-linux-gnueabihf
          if [ "${{ matrix.target }}" = "armv7-unknown-linux-gnueabihf" ]; then
            echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV
          fi

          # For x86_64-unknown-linux-musl
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        working-directory: native
        run: npm ci

      - name: Build native module
        working-directory: native
        run: npx napi build --platform --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: native/*.node
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        working-directory: native
        run: npm ci

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: native/artifacts

      - name: List artifacts
        run: ls -R native/artifacts

      - name: Move artifacts
        working-directory: native
        run: npx napi artifacts

      - name: List npm directory
        working-directory: native
        run: ls -la npm/ || echo "No npm directory yet"

      - name: Prepare packages
        working-directory: native
        run: npx napi prepublish -t npm

      - name: List packages
        working-directory: native
        run: |
          echo "=== Main package ==="
          ls -la
          echo "=== Platform packages ==="
          ls -la npm/ || true

      - name: Publish (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        working-directory: native
        run: |
          echo "Dry run - would publish:"
          npm pack --dry-run
          for dir in npm/*/; do
            echo "--- $dir ---"
            (cd "$dir" && npm pack --dry-run)
          done

      - name: Publish platform packages
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: native
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in npm/*/; do
            echo "Publishing $dir..."
            (cd "$dir" && npm publish --access public) || echo "Failed to publish $dir (may already exist)"
          done

      - name: Publish main package
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: native
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
