name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build -p memvid-core --verbose

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: cargo test -p memvid-core --verbose

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        # Run tests with single thread on Windows to avoid file locking contention
        # Windows mmap/file locking semantics can cause "Access is denied" errors
        # when multiple tests create Tantivy indexes simultaneously
        run: cargo test -p memvid-core --verbose -- --test-threads=1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt -p memvid-core -- --check

      # TODO: Re-enable clippy after fixing pre-existing pedantic warnings in core
      # - name: Clippy
      #   run: cargo clippy -p memvid-core
